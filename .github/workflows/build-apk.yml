name: Build IANOVA APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"   # the version this app was last built with
          cache: true

      - name: Use a fixed signing key so each build installs over the last one
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get
      - name: Build release APK
        run: |
          if [ -n "${{ vars.API_BASE_URL }}" ]; then
            flutter build apk --release --dart-define=API_BASE_URL="${{ vars.API_BASE_URL }}"
          else
            flutter build apk --release
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ianova-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
