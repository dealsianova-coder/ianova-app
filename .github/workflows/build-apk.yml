name: Build IANOVA APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"   # the version this app was last built with
          cache: true

      - name: Use a fixed signing key so each build installs over the last one
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Keep the shop APK, then build the separate Admin app
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/IANOVA.apk
          IANOVA_APP_ID=com.example.ianova_admin IANOVA_APP_LABEL="IANOVA Admin" flutter build apk --release -t lib/main_admin.dart
          cp build/app/outputs/flutter-apk/app-release.apk dist/IANOVA-Admin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ianova-apk
          path: dist/IANOVA.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ianova-admin-apk
          path: dist/IANOVA-Admin.apk
          if-no-files-found: error
